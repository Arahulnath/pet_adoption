apiVersion: apps/v1
kind: Deployment
metadata:
  name: petadoption-frontend
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: petadoption-frontend
  template:
    metadata:
      labels:
        app: petadoption-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/arahulnath/petadoption-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: default
spec:
  selector:
    app: petadoption-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
