apiVersion: apps/v1
kind: Deployment
metadata:
  name: petadoption-backend
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: petadoption-backend
  template:
    metadata:
      labels:
        app: petadoption-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/arahulnath/petadoptionsrs/petadoption-backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: petadoption-config
            - secretRef:
                name: petadoption-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: default
spec:
  selector:
    app: petadoption-backend
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
