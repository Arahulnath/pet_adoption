apiVersion: v1
kind: Secret
metadata:
  name: petadoption-secrets
  namespace: default
type: Opaque
stringData:
  DB_PASSWORD: "changeme"
  JWT_SECRET: "PetAdoptionSuperSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm!"
  MAIL_USERNAME: "your-email@gmail.com"
  MAIL_PASSWORD: "your-app-password"
  DONATION_GATEWAY_URL: "https://your-payment-gateway.com/donate"
# NOTE: Replace stringData values with real secrets before applying.
# Use: kubectl create secret generic petadoption-secrets --from-env-file=.env
